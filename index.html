<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avinash babu game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== Stunning Background ===== */
body{
margin:0;
font-family:Segoe UI;
color:white;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* ===== Title ===== */
.title{
text-align:center;
margin:40px 0;
font-size:42px;
font-weight:bold;
transition:0.4s;
}
.title:hover{
text-shadow:0 0 20px cyan,0 0 40px magenta;
transform:scale(1.1);
}

/* ===== Cards ===== */
.game-card{
background:rgba(255,255,255,0.1);
border-radius:20px;
padding:30px;
cursor:pointer;
transition:0.4s;
backdrop-filter:blur(10px);
}
.game-card:hover{
transform:translateY(-15px);
box-shadow:0 20px 40px rgba(0,255,255,0.5);
background:rgba(0,255,255,0.2);
}

/* ===== Overlay ===== */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
}
.close-btn{
position:absolute;
top:20px;
right:30px;
font-size:30px;
cursor:pointer;
}

/* Timer */
.timer{
position:absolute;
top:20px;
left:30px;
font-size:20px;
}

/* Popup */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}
.popup-content{
background:linear-gradient(135deg,#ff512f,#dd2476);
padding:40px;
border-radius:20px;
text-align:center;
animation:pop 0.5s ease;
}
@keyframes pop{
from{transform:scale(0.5);}
to{transform:scale(1);}
}

canvas{
border:2px solid cyan;
background:#111;
}

.grid{
display:grid;
grid-template-columns:repeat(5,60px);
gap:5px;
}
.cell{
width:60px;height:60px;background:#333;
display:flex;align-items:center;justify-content:center;
cursor:pointer;
}
.cell:hover{background:#555;}

</style>
</head>
<body>

<h1 class="title">🎮 AVINASH BABU GAME 🎮</h1>

<div class="container">
<div class="row g-4">

<div class="col-md-4">
<div class="game-card" onclick="openGame('hangman')">
<h3>Hangman Desert</h3>
<p>Cartoon human + countdown</p>
</div>
</div>

<div class="col-md-4">
<div class="game-card" onclick="openGame('mine')">
<h3>Minesweeper</h3>
<p>Find safe blocks</p>
</div>
</div>

<div class="col-md-4">
<div class="game-card" onclick="openGame('plane')">
<h3>Aeroplane Battle</h3>
<p>Fly & avoid enemy planes</p>
</div>
</div>

</div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
<div class="close-btn" onclick="closeGame()">✖</div>
<div class="timer" id="timer"></div>
<div id="gameContent"></div>
</div>

<!-- Popup -->
<div class="popup" id="popup">
<div class="popup-content">
<h2 id="winnerText"></h2>
<button class="btn btn-light mt-3" onclick="closePopup()">Close</button>
</div>
</div>

<script>

let timerInterval;
let countdown=60;

function openGame(game){
document.getElementById("overlay").style.display="flex";
countdown=60;
document.getElementById("timer").innerText="Time Left: "+countdown;

timerInterval=setInterval(()=>{
countdown--;
document.getElementById("timer").innerText="Time Left: "+countdown;
if(countdown<=0){
clearInterval(timerInterval);
showWinner("Time Up!");
}
},1000);

if(game==="hangman") startHangman();
if(game==="mine") startMine();
if(game==="plane") startPlane();
}

function closeGame(){
clearInterval(timerInterval);
document.getElementById("overlay").style.display="none";
document.getElementById("gameContent").innerHTML="";
}

function showWinner(text){
clearInterval(timerInterval);
document.getElementById("winnerText").innerText=text;
document.getElementById("popup").style.display="flex";
}
function closePopup(){
document.getElementById("popup").style.display="none";
closeGame();
}

/* ===== Hangman Desert ===== */
function startHangman(){
let word="DESERT";
let guessed=[];
let content=document.getElementById("gameContent");
content.innerHTML=`<h2>Desert Hangman</h2>
<canvas id="hangCanvas" width="400" height="300"></canvas>
<p id="wordDisplay"></p>
<input id="letter" maxlength="1">
<button onclick="guessLetter()">Guess</button>`;

let canvas=document.getElementById("hangCanvas");
let ctx=canvas.getContext("2d");

/* Desert Background */
ctx.fillStyle="#c2b280";
ctx.fillRect(0,0,400,300);

/* Deckboard */
ctx.fillStyle="#8b4513";
ctx.fillRect(150,50,100,10);
ctx.fillRect(195,50,10,100);

function drawHuman(step){
if(step>0){ctx.beginPath();ctx.arc(200,170,15,0,Math.PI*2);ctx.stroke();}
if(step>1){ctx.moveTo(200,185);ctx.lineTo(200,230);ctx.stroke();}
if(step>2){ctx.moveTo(200,200);ctx.lineTo(180,210);ctx.stroke();}
if(step>3){ctx.moveTo(200,200);ctx.lineTo(220,210);ctx.stroke();}
if(step>4){ctx.moveTo(200,230);ctx.lineTo(180,250);ctx.stroke();}
if(step>5){ctx.moveTo(200,230);ctx.lineTo(220,250);ctx.stroke();}
}

window.guessLetter=function(){
let l=document.getElementById("letter").value.toUpperCase();
if(!word.includes(l)) drawHuman(guessed.length+1);
guessed.push(l);
update();
}

function update(){
document.getElementById("wordDisplay").innerText=
word.split("").map(c=>guessed.includes(c)?c:"_").join(" ");
if(word.split("").every(c=>guessed.includes(c))){
showWinner("Hangman Winner!");
}
}
update();
}

/* ===== Minesweeper ===== */
function startMine(){
let content=document.getElementById("gameContent");
content.innerHTML="<h2>Minesweeper</h2><div class='grid'></div>";
let grid=document.querySelector(".grid");
let mine=Math.floor(Math.random()*25);
for(let i=0;i<25;i++){
let cell=document.createElement("div");
cell.className="cell";
cell.onclick=function(){
if(i===mine){
cell.style.background="red";
showWinner("Mine Exploded!");
}else{
cell.style.background="green";
if(document.querySelectorAll(".cell[style*='green']").length===24)
showWinner("Minesweeper Winner!");
}
};
grid.appendChild(cell);
}
}

/* ===== Aeroplane Game ===== */
function startPlane(){
let content=document.getElementById("gameContent");
content.innerHTML="<h2>Aeroplane Battle</h2><canvas id='planeCanvas' width='500' height='400'></canvas>";
let canvas=document.getElementById("planeCanvas");
let ctx=canvas.getContext("2d");

let x=250;
let enemies=[];
let propAngle=0;

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft") x-=15;
if(e.key==="ArrowRight") x+=15;
});

/* Create enemy */
setInterval(()=>{
enemies.push({x:Math.random()*460,y:-20});
},2000);

function drawPlane(px,py){
ctx.fillStyle="cyan";
/* body */
ctx.fillRect(px,py,40,20);
/* wings */
ctx.fillRect(px-20,py+5,80,5);
/* tail */
ctx.fillRect(px+30,py-10,10,10);
/* propeller */
ctx.save();
ctx.translate(px,py+10);
ctx.rotate(propAngle);
ctx.fillRect(-15,-2,30,4);
ctx.restore();
}

function loop(){
ctx.clearRect(0,0,500,400);

propAngle+=0.2;
drawPlane(x,350);

for(let i=0;i<enemies.length;i++){
let e=enemies[i];
e.y+=3;
drawPlane(e.x,e.y);

/* collision */
if(Math.abs(e.x-x)<30 && Math.abs(e.y-350)<20){
showWinner("Plane Crashed!");
}
}

requestAnimationFrame(loop);
}
loop();
}

</script>
</body>
</html>
